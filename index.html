  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

in: 0 auto;\">\n        <h2 style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 44px; font-weight: 800; color: #fff; margin: 0 0 16px; letter-spacing: -0.01em;\">Vamos aliviar o seu fim de mês?<\/h2>\n        <p style=\"font-size: 19px; color: #D2C8B4; margin: 0 0 32px; line-height: 1.6;\">Fale agora com um consultor. A consultoria é gratuita e sem compromisso.<\/p>\n        <div style=\"display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;\">\n          <a href=\"{{ waLink }}\" target=\"_blank\" style=\"text-decoration: none; display: inline-flex; align-items: center; gap: 10px; background: #158746; color: #fff; padding: 18px 34px; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px; box-shadow: 0 14px 30px -12px rgba(31,168,85,.7);\">Falar no WhatsApp<\/a>\n          <span data-fx-btn=\"1\" onclick=\"{{ goSimulador }}\" style=\"cursor: pointer; display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(90deg,#E8C57A,#B08A3C); color: #17120D; padding: 18px 34px; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px;\">Fazer simulação<\/span>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n  <\/sc-if>\n\n  <!-- ========================= SERVIÇOS ========================= -->\n  <sc-if value=\"{{ isServicos }}\" hint-placeholder-val=\"{{ false }}\">\n  <main data-screen-label=\"Serviços\">\n    <section style=\"background: linear-gradient(160deg,#0E0A08,#2A2118); padding: 64px 28px;\">\n      <div style=\"max-width: 1200px; margin: 0 auto; text-align: center;\">\n        <h1 style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 48px; font-weight: 800; color: #fff; margin: 0 0 14px; letter-spacing: -0.01em;\">Nossos serviços<\/h1>\n        <p style=\"font-size: 19px; color: #D2C8B4; margin: 0 auto; max-width: 620px; line-height: 1.6;\">Soluções de crédito pensadas para aposentados, pensionistas do INSS e servidores federais.<\/p>\n      <\/div>\n    <\/section>\n    <section style=\"background: #fff; padding: 72px 28px;\">\n      <div style=\"max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;\">\n        <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: start; background: #FAF8F4; border-radius: 20px; padding: 32px;\">\n          <div style=\"width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(145deg,#FAF3E4,#F5E6C8); display: flex; align-items: center; justify-content: center; font-size: 34px;\">🏦<\/div>\n          <div><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #17120D; margin-bottom: 8px;\">Empréstimo consignado<\/div><p style=\"font-size: 17px; color: #6B6155; line-height: 1.65; margin: 0;\">Crédito com desconto direto no benefício ou contracheque, com as menores taxas do mercado. Ideal para quem busca segurança e parcelas que cabem no orçamento.<\/p><\/div>\n        <\/div>\n        <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: start; background: #FAF8F4; border-radius: 20px; padding: 32px;\">\n          <div style=\"width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(145deg,#FAF3E4,#F5E6C8); display: flex; align-items: center; justify-content: center; font-size: 34px;\">🔄<\/div>\n          <div><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #17120D; margin-bottom: 8px;\">Refinanciamento<\/div><p style=\"font-size: 17px; color: #6B6155; line-height: 1.65; margin: 0;\">Renove um contrato já existente com condições melhores e, se quiser, libere um novo valor — tudo sem comprometer mais a sua margem.<\/p><\/div>\n        <\/div>\n        <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: start; background: #FDF9EF; border-radius: 20px; padding: 32px;\">\n          <div style=\"width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(145deg,#FAF3E4,#F5E6C8); display: flex; align-items: center; justify-content: center; font-size: 34px;\">📉<\/div>\n          <div><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #17120D; margin-bottom: 8px;\">Negociação para redução de parcelas<\/div><p style=\"font-size: 17px; color: #6B6155; line-height: 1.65; margin: 0;\">Conversamos diretamente com o banco para reduzir o valor das suas parcelas e aliviar o peso no fim do mês.<\/p><\/div>\n        <\/div>\n        <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: start; background: #FAF8F4; border-radius: 20px; padding: 32px;\">\n          <div style=\"width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(145deg,#FAF3E4,#F5E6C8); display: flex; align-items: center; justify-content: center; font-size: 34px;\">💳<\/div>\n          <div><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #17120D; margin-bottom: 8px;\">Crédito pessoal<\/div><p style=\"font-size: 17px; color: #6B6155; line-height: 1.65; margin: 0;\">Quando você precisa de um dinheiro extra, buscamos a melhor opção de crédito pessoal de acordo com o seu perfil.<\/p><\/div>\n        <\/div>\n        <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: start; background: #FAF8F4; border-radius: 20px; padding: 32px;\">\n          <div style=\"width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(145deg,#eafaf0,#d5f1e0); display: flex; align-items: center; justify-content: center; font-size: 34px;\">🛟<\/div>\n          <div><div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #17120D; margin-bottom: 8px;\">Acompanhamento e central de SAC<\/div><p style=\"font-size: 17px; color: #6B6155; line-height: 1.65; margin: 0;\">Não desaparecemos depois da contratação. Nossa central acompanha seu contrato e resolve qualquer questão sempre que você precisar.<\/p><\/div>\n        <\/div>\n      <\/div>\n      <div style=\"text-align: center; margin-top: 44px;\">\n        <a href=\"{{ waLink }}\" target=\"_blank\" style=\"text-decoration: none; display: inline-flex; align-items: center; gap: 10px; background: #158746; color: #fff; padding: 18px 34px; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px; box-shadow: 0 14px 30px -12px rgba(31,168,85,.7);\">Quero falar com um consultor<\/a>\n      <\/div>\n    <\/section>\n  <\/main>\n  <\/sc-if>\n\n  <!-- ========================= SOBRE ========================= -->\n  <sc-if value=\"{{ isSobre }}\" hint-placeholder-val=\"{{ false }}\">\n  <main data-screen-label=\"Sobre\">\n    <section style=\"background: linear-gradient(160deg,#0E0A08,#2A2118); padding: 64px 28px;\">\n      <div style=\"max-width: 820px; margin: 0 auto; text-align: center;\">\n        <h1 style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 48px; font-weight: 800; color: #fff; margin: 0 0 14px; letter-spacing: -0.01em;\">Sobre a GV<\/h1>\n        <p style=\"font-size: 19px; color: #D2C8B4; margin: 0; line-height: 1.6;\">Assessoria financeira que coloca as pessoas em primeiro lugar.<\/p>\n      <\/div>\n    <\/section>\n    <section style=\"background: #fff; padding: 72px 28px;\">\n      <div style=\"max-width: 820px; margin: 0 auto;\">\n        <img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMTAwIDUwMCIgd2lkdGg9IjExMDAiIGhlaWdodD0iNTAwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkF0ZW5kaW1lbnRvIGh1bWFubywgcGVzc29hIGNvbnZlcnNhbmRvIGNvbSBjb25zdWx0b3IiPgogIDxkZWZzPgogICAgPGxpbmVhckdyYWRpZW50IGlkPSJmdW5kbyIgeDE9IjAiIHkxPSIwIiB4Mj0iMSIgeTI9IjEiPgogICAgICA8c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiMyNDFCMTIiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMTUxMDBBIi8+Ci car o crédito consignado para quem mais precisa de respeito e clareza: aposentados, pensionistas do INSS e servidores federais.<\/p>\n        <p style=\"font-size: 18px; color: #6B6155; line-height: 1.75; margin: 0 0 24px;\">Acreditamos que cuidar do dinheiro do cliente é, antes de tudo, cuidar da pessoa. Por isso, ouvimos a sua real necessidade, explicamos cada detalhe com calma e indicamos apenas o que faz sentido para o seu momento de vida.<\/p>\n        <p style=\"font-size: 18px; color: #6B6155; line-height: 1.75; margin: 0;\">Nosso compromisso com o atendimento se reflete na prática: cada cliente fala com uma pessoa de verdade, do primeiro contato até resolver, de verdade, qualquer questão.<\/p>\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 48px;\">\n          <div style=\"background: #FAF8F4; border-radius: 18px; padding: 28px; text-align: center;\">\n            <div data-count=\"84\" data-suffix=\"x\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 800; color: #7A5F1E;\">84x<\/div>\n            <div style=\"font-size: 15px; color: #6B6155; font-weight: 600; margin-top: 4px;\">prazo máximo no INSS<\/div>\n          <\/div>\n          <div style=\"background: #FAF8F4; border-radius: 18px; padding: 28px; text-align: center;\">\n            <div data-count=\"35\" data-suffix=\"%\" style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 800; color: #7A5F1E;\">35%<\/div>\n            <div style=\"font-size: 15px; color: #6B6155; font-weight: 600; margin-top: 4px;\">da margem para empréstimo<\/div>\n          <\/div>\n          <div style=\"background: #FAF8F4; border-radius: 18px; padding: 28px; text-align: center;\">\n            <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 34px; font-weight: 800; color: #7A5F1E;\">INSS + Federal<\/div>\n            <div style=\"font-size: 15px; color: #6B6155; font-weight: 600; margin-top: 4px;\">nossa especialidade<\/div>\n          <\/div>\n        <\/div>\n        <div style=\"background: linear-gradient(150deg,#2A2118,#0E0A08); border-radius: 22px; padding: 40px; margin-top: 40px; text-align: center;\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 10px;\">Nossa missão<\/div>\n          <p style=\"font-size: 18px; color: #D2C8B4; line-height: 1.7; margin: 0;\">Levar tranquilidade financeira a quem construiu o país, com atendimento humano, transparente e do tamanho da necessidade de cada cliente.<\/p>\n        <\/div>\n        \n      <\/div>\n    <\/section>\n  <\/main>\n  <\/sc-if>\n\n  <!-- ========================= SIMULADOR ========================= -->\n  <sc-if value=\"{{ isSimulador }}\" hint-placeholder-val=\"{{ false }}\">\n  <main data-screen-label=\"Simulador\">\n    <section style=\"background: linear-gradient(160deg,#0E0A08,#2A2118); padding: 56px 28px;\">\n      <div style=\"max-width: 1000px; margin: 0 auto; text-align: center;\">\n        <h1 style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 46px; font-weight: 800; color: #fff; margin: 0 0 12px; letter-spacing: -0.01em;\">Simulador de empréstimo<\/h1>\n        <p style=\"font-size: 18px; color: #D2C8B4; margin: 0; line-height: 1.6;\">Faça uma estimativa rápida. Sem cadastro, sem compromisso.<\/p>\n      <\/div>\n    <\/section>\n    <section style=\"background: #FAF8F4; padding: 56px 28px 80px;\">\n      <div style=\"max-width: 1000px; margin: 0 auto; background: #fff; border-radius: 24px; box-shadow: 0 24px 60px -28px rgba(16,44,84,.35); overflow: hidden; display: grid; grid-template-columns: 1.15fr 0.85fr;\">\n        <!-- inputs -->\n        <div style=\"padding: 40px;\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: #17120D; margin-bottom: 10px;\">O que você procura?<\/div>\n          <div style=\"display: flex; gap: 10px; margin-bottom: 26px;\">\n            <span onclick=\"{{ setModeNovo }}\" style=\"flex: 1; text-align: center; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; background: {{ modeNovoBg }}; color: {{ modeNovoColor }};\">Novo empréstimo<\/span>\n            <span onclick=\"{{ setModeReduzir }}\" style=\"flex: 1; text-align: center; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; background: {{ modeReduzirBg }}; color: {{ modeReduzirColor }};\">Reduzir minha parcela<\/span>\n          <\/div>\n\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: #17120D; margin-bottom: 10px;\">Seu benefício<\/div>\n          <div style=\"display: flex; gap: 10px; margin-bottom: 26px;\">\n            <span onclick=\"{{ setBenefitINSS }}\" style=\"flex: 1; text-align: center; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; background: {{ inssBg }}; color: {{ inssColor }};\">INSS<\/span>\n            <span onclick=\"{{ setBenefitFederal }}\" style=\"flex: 1; text-align: center; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; background: {{ federalBg }}; color: {{ federalColor }};\">Servidor Federal<\/span>\n          <\/div>\n\n          <sc-if value=\"{{ isNovo }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;\">\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: #17120D;\">Valor que você precisa<\/span>\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #7A5F1E;\">{{ valorFmt }}<\/span>\n            <\/div>\n            <input type=\"range\" min=\"1000\" max=\"50000\" step=\"500\" value=\"{{ simValor }}\" onchange=\"{{ onValor }}\" style=\"width: 100%; accent-color: #7A5F1E; height: 6px; margin-bottom: 26px;\">\n          <\/sc-if>\n\n          <sc-if value=\"{{ isReduzir }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;\">\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: #17120D;\">Saldo devedor atual<\/span>\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #7A5F1E;\">{{ saldoFmt }}<\/span>\n            <\/div>\n            <input type=\"range\" min=\"1000\" max=\"80000\" step=\"500\" value=\"{{ simSaldo }}\" onchange=\"{{ onSaldo }}\" style=\"width: 100%; accent-color: #7A5F1E; height: 6px; margin-bottom: 22px;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;\">\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: #17120D;\">Parcela que você paga hoje<\/span>\n              <span style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; color: #7A5F1E;\">{{ curParcelaFmt }}<\/span>\n            <\/div>\n            <input type=\"range\" min=\"100\" max=\"3000\" step=\"50\" value=\"{{ simCurParcela }}\" onchange=\"{{ onCurParcela }}\" style=\"width: 100%; accent-color: #7A5F1E; height: 6px; margin-bottom: 26px;\">\n          <\/sc-if>\n\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: #17120D; margin-bottom: 10px;\">Em quantas parcelas<\/div>\n          <select value=\"{{ simPrazo }}\" onchange=\"{{ onPrazo }}\" style=\"width: 100%; padding: 15px 14px; border-radius: 12px; border: 1.5px solid #EAE5DB; font-family: 'Mulish', sans-serif; font-weight: 700; font-size: 16px; color: #17120D; background: #FBF9F5;\">\n r-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 17px;\">Perguntar no WhatsApp<\/a>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/main>\n  <\/sc-if>\n\n  <!-- ========================= FOOTER ========================= -->\n  <footer style=\"background: #070505; padding: 56px 28px 28px;\">\n    <div style=\"max-width: 1200px; margin: 0 auto;\">\n      <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 36px; padding-bottom: 36px; border-bottom: 1px solid rgba(255,255,255,.1);\">\n        <div>\n          <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:18px;\"><img src=\"b25ebf7c-5244-4bd0-a92b-d2e875f58dc5\" alt=\"GV Consultoria\" style=\"height: 40px; width: auto; display: block; flex:none;\"><span style=\"font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:500; color:rgba(255,255,255,.6); padding-left:12px; border-left:1px solid rgba(255,255,255,.18); line-height:1.25;\">Sua vida financeira<br>mais leve<\/span><\/div>\n          <p style=\"font-size: 15px; color: #9C9282; line-height: 1.65; margin: 0; max-width: 280px;\">Assessoria financeira especializada em crédito consignado para aposentados, pensionistas do INSS e servidores federais.<\/p>\n        <\/div>\n        <div>\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #fff; font-size: 15px; margin-bottom: 16px;\">Navegação<\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 15px;\">\n            <span onclick=\"{{ goHome }}\" style=\"cursor: pointer; color: #B8AE9C;\">Início<\/span>\n            <span onclick=\"{{ goServicos }}\" style=\"cursor: pointer; color: #B8AE9C;\">Serviços<\/span>\n            <span onclick=\"{{ goSobre }}\" style=\"cursor: pointer; color: #B8AE9C;\">Sobre<\/span>\n            <span onclick=\"{{ goSimulador }}\" style=\"cursor: pointer; color: #B8AE9C;\">Simulador<\/span>\n          <\/div>\n        <\/div>\n        <div>\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #fff; font-size: 15px; margin-bottom: 16px;\">Atendimento<\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 15px;\">\n            <span onclick=\"{{ goFaq }}\" style=\"cursor: pointer; color: #B8AE9C;\">Dúvidas frequentes<\/span>\n            <span onclick=\"{{ goContato }}\" style=\"cursor: pointer; color: #B8AE9C;\">Fale conosco<\/span>\n            <span style=\"color: #B8AE9C;\">Seg. a Sex., 9h às 18h<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"{{ showContato }}\">\n          <div style=\"font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #fff; font-size: 15px; margin-bottom: 16px;\">Contato<\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 11px; font-size: 15px;\">\n            <a href=\"{{ tel0800Link }}\" style=\"{{ show0800 }}; text-decoration: none; color: #B8AE9C;\">{{ tel0800 }}<\/a>\n            <a href=\"{{ waLink }}\" target=\"_blank\" style=\"{{ showPhone }}; text-decoration: none; color: #B8AE9C;\">{{ phone }}<\/a>\n            <a href=\"{{ mailLink }}\" style=\"{{ showEmail }}; text-decoration: none; color: #B8AE9C; word-break: break-all;\">{{ email }}<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-top: 24px;\">\n        <span style=\"font-size: 13px; color: #8B8274;\">© 2026 GV Consultoria. Todos os direitos reservados.<\/span>\n        <span style=\"font-size: 13px; color: #8B8274; max-width: 560px; text-align: right;\">A GV atua como correspondente/assessoria e não realiza empréstimos diretamente. Valores simulados são estimativos.<\/span>\n      <\/div>\n    <\/div>\n  <\/footer>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;$doc&quot;:&quot;Contatos da empresa. VAZIO = o campo nao aparece no site. Cada empresa tem o SEU contato: nunca reaproveitar numero/e-mail de outro cliente aqui.&quot;,&quot;tel0800&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    page: 'home',\n    simMode: 'novo',      // novo | reduzir\n    simBenefit: 'INSS',   // INSS | Federal\n    simValor: 5000,\n    simPrazo: 60,\n    simSaldo: 18000,\n    simCurParcela: 600,\n    openFaq: 0,\n    fName: '', fPhone: '', fTipo: 'Aposentado(a) INSS', fMsg: ''\n  };\n\n  go(page) {\n    this.setState({ page });\n    if (typeof window !== 'undefined') {\n      window.scrollTo(0, 0);\n      requestAnimationFrame(() => requestAnimationFrame(() => {\n        const mn = document.querySelector('main');\n        if (mn && mn.animate) mn.animate(\n          [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }],\n          { duration: 420, easing: 'ease' }\n        );\n      }));\n    }\n  }\n\n  rate() { return this.state.simBenefit === 'INSS' ? 0.0166 : 0.0150; }\n\n  pmt(pv, n) {\n    const i = this.rate();\n    return pv * i / (1 - Math.pow(1 + i, -n));\n  }\n\n  brl(n, cents) {\n    if (n == null || isNaN(n)) n = 0;\n    return 'R$ ' + Number(n).toLocaleString('pt-BR', {\n      minimumFractionDigits: cents ? 2 : 0,\n      maximumFractionDigits: cents ? 2 : 0\n    });\n  }\n\n  componentDidMount() {\n    if (typeof window === 'undefined') return;\n    this._io = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; e.target.removeAttribute('data-fx-hidden'); this._io.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    this._io2 = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { this._countUp(e.target); this._io2.unobserve(e.target); } });\n    }, { threshold: 0.5 });\n    this._onScroll = () => {\n      const hd = document.querySelector('header'); if (!hd) return;\n      const inner = hd.firstElementChild; const img = hd.querySelector('img');\n      const s = window.scrollY > 24;\n      if (inner) { inner.style.transition = 'padding .25s ease'; inner.style.paddingTop = s ? '4px' : '8px'; inner.style.paddingBottom = s ? '4px' : '8px'; }\n      if (img) { img.style.transition = 'height .25s ease'; img.style.height = s ? '28px' : '34px'; }\n      hd.style.boxShadow = s ? '0 6px 24px -8px rgba(0,0,0,.6)' : '0 4px 20px -8px rgba(0,0,0,.5)';\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._fxTimer = setTimeout(() => {\n      document.querySelectorAll('[data-fx-hidden]').forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; el.removeAttribute('data-fx-hidden'); });\n    }, 1700);\n    this._setupFx();\n  }\n\n  componentDidUpdate() { this._setupFx(); }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._io2) this._io2.disconnect();\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._fxTimer) clearTimeout(this._fxTimer);\n  }\n\n  _countUp(el) {\n    const target = parseFloat(el.dataset.count); if (isNaN(target)) return;\n    const prefix = el.dataset.prefix || ''; const suffix = el.dataset.suffix || '';\n    const dur = 1100; const start = performance.now();\n    const tick = (now) => {\n      const p = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      el.textContent = prefix + Math.round(target * e) + suffix;\n      if (p < 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  _setupFx() {\n    if (typeof window === 'undefined' || !this._io) return;\n    // subtle button hover\n    document.querySelectorAll('a[target=\"_blank\"], [data-fx-btn]').forEach(el => {\n      if (el.__fxBound) return; el.__fxBound = true;\n      el.addEventListener('mouseenter', () => { el.style.transition = 'transform .18s ease, filter .18s ease'; el.style.transform = 'translateY(-2px)'; el.style.filter = 'brightness(1.06)'; });\n      el.addEventListener('mouseleave', () => { el.style.transform = ''; el.style.filter = ''; });\n    });\n    // scroll reveal for sections\n    document.querySelectorAll('section').forEach(el => {\n      if (el.dataset.fxR) return; el.dataset.fxR = '1';\n      el.style.transition = 'opacity .7s ease, transform .7s ease';\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight * 0.9) {\n        el.style.opacity = '0'; el.style.transform = 'translateY(14px)';\n        requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'none'; }));\n      } else {\n        el.style.opacity = '0'; el.style.transform = 'translateY(28px)'; el.setAttribute('data-fx-hidden', '1'); this._io.observe(el);\n      }\n    });\n    // count-up\n    document.querySelectorAll('[data-count]').forEach(el => { if (el.dataset.fxC) return; el.dataset.fxC = '1'; this._io2.observe(el); });\n  }\n\n  renderVals() {\n    const s = this.state;\n\n    // Contatos resolvidos em TEMPO DE BUILD a partir do props.json (ver build.py).\n    // ⚠️ Necessário porque o runtime não entrega o data-props: this.props chega {}.\n    // Era isso que fazia o props.json parecer \"sem efeito\" e mantinha na tela o\n    // fallback herdado da MMS — o 0800 e o e-mail REAIS dela, em produção lá.\n    //\n    // Regra: cada empresa tem o SEU contato. Enquanto o dado real não existe, o\n    // campo NÃO é exibido (vazio some da tela) — melhor faltar do que mostrar\n    // número de outro ou número falso.\n    const P = Object.assign({}, {\"tel0800\": \"\", \"phone\": \"\", \"whatsapp\": \"\", \"email\": \"\"}, this.props || {});\n    const val = (v) => {\n      if (v && typeof v === 'object') v = ('default' in v) ? v.default : '';\n      return v == null ? '' : String(v).trim();\n    };\n    const vazio = (v) => {\n      const t = val(v);\n      if (!t) return true;\n      // placeholder = só zeros/pontuação, ou e-mail de exemplo\n      if (/^[\\s\\-()+.0]*$/.test(t)) return true;\n      if (/@(exemplo|example)\\./i.test(t)) return true;\n      return false;\n    };\n\n    const hasPhone = !vazio(P.phone);\n    const has0800  = !vazio(P.tel0800);\n    const hasEmail = !vazio(P.email);\n    const hasWa    = !vazio(P.whatsapp);\n\n    const phone   = hasPhone ? val(P.phone)   : '';\n    const tel0800 = has0800  ? val(P.tel0800) : '';\n    const email   = hasEmail ? val(P.email)   : '';\n    const waDigits = hasWa ? val(P.whatsapp).replace(/\\D/g, '') : '';\n    const wa = (msg) => hasWa\n      ? 'https://wa.me/' + waDigits + (msg ? '?text=' + encodeURIComponent(msg) : '')\n      : '#';\n\n    const n = +s.simPrazo;\n    const isNovo = s.simMode === 'novo';\n    const parcela = isNovo ? this.pmt(+s.simValor, n) : this.pmt(+s.simSaldo, n);\n    const total = parcela * n;\n    const economia = Math.max(0, (+s.simCurParcela) - parcela);\n\n    const sel = (active) => ({\n      bg: active ? '#17120D' : '#F3F0EA',\n      color: active ? '#fff' : '#6E6558'\n    });\n    const inss = sel(s.simBenefit === 'INSS');\n    const fed = sel(s.simBenefit === 'Federal');\n    const mNovo = sel(s.simMode === 'novo');\n    const mRed = sel(s.simMode === 'reduzir');\n\n    const faqRaw = [\n      ['Quem pode contratar o empréstimo consignado?', 'Aposentados e pensionistas do INSS e servidores públicos federais com margem disponível no benefício ou contracheque. A gente verifica sua margem gratuitamente.'],\n      ['O desconto vem direto do meu benefício?', 'Sim. No consignado, a parcela é descontada automaticamente do seu benefício ou salário, o que garante as menores taxas e mais segurança para você.'],\n      ['Como funciona a redução de parcelas?', 'Analisamos seus contratos atuais e negociamos diretamente com o banco, geralmente por meio de refinanciamento, para diminuir o valor que você paga todo mês.'],\n      ['Preciso pagar alguma coisa pela consultoria?', 'Não. A análise e a orientação da GV são gratuitas. Você só assume o contrato se as condições forem boas para você.'],\n      ['Em quanto tempo recebo um retorno?', 'Nosso compromisso é responder em até 24 horas. Muitas vezes o retorno acontece no mesmo dia do contato.'],\n      ['A GV é confiável?', 'Sim. Somos correspondente bancário e trabalhamos apenas com instituições autorizadas pelo Banco Central. Você fala com uma pessoa de verdade do início ao fim.']\n    ];\n    const faqItems = faqRaw.map((f, i) => ({\n      q: f[0], a: f[1],\n      open: s.openFaq === i,\n      sign: s.openFaq === i ? '−' : '+',\n      toggle: () => this.setState({ openFaq: s.openFaq === i ? -1 : i })\n    }));\n\n    const simMsg = isNovo\n      ? `Olá! Simulei um empréstimo de ${this.brl(s.simValor)} em ${n}x (${s.simBenefit}), parcela estimada de ${this.brl(parcela, true)}. Gostaria de saber mais.`\n      : `Olá! Quero reduzir minha parcela. Hoje pago ${this.brl(s.simCurParcela, true)} sobre um saldo de ${this.brl(s.simSaldo)} (${s.simBenefit}). Pode me ajudar?`;\n    const formMsg = `Olá! Meu nome é ${s.fName || '[nome]'}. Sou ${s.fTipo}. Telefone: ${s.fPhone || '[telefone]'}. ${s.fMsg ? 'Mensagem: ' + s.fMsg : ''}`;\n\n    return {\n      isHome: s.page === 'home',\n      isServicos: s.page === 'servicos',\n      isSobre: s.page === 'sobre',\n      isSimulador: s.page === 'simulador',\n      isContato: s.page === 'contato',\n      isFaq: s.page === 'faq',\n\n      goHome: () => this.go('home'),\n      goServicos: () => this.go('servicos'),\n      goSobre: () => this.go('sobre'),\n      goSimulador: () => this.go('simulador'),\n      goContato: () => this.go('contato'),\n      goFaq: () => this.go('faq'),\n\n      phone, email, tel0800,\n      hasPhone, has0800, hasEmail, hasWa,\n      // display:none quando o contato ainda não existe — o bloco some da tela\n      show0800: has0800 ? '' : 'display:none',\n      showPhone: hasPhone ? '' : 'display:none',\n      showEmail: hasEmail ? '' : 'display:none',\n      showWa: hasWa ? '' : 'display:none',\n      // coluna \"Contato\" do rodapé some inteira se não houver NENHUM contato\n      showContato: (has0800 || hasPhone || hasEmail) ? '' : 'display:none',\n      tel0800Link: has0800 ? 'tel:+55' + tel0800.replace(/\\D/g, '') : '#',\n      waLink: wa('Olá! Gostaria de uma consultoria sobre crédito consignado.'),\n      waLinkSim: wa(simMsg),\n      waLinkForm: wa(formMsg),\n      mailLink: hasEmail ? 'mailto:' + email : '#',\n\n      isNovo, isReduzir: !isNovo,\n      simValor: s.simValor, simPrazo: String(s.simPrazo), simSaldo: s.simSaldo, simCurParcela: s.simCurParcela,\n      valorFmt: this.brl(s.simValor),\n      saldoFmt: this.brl(s.simSaldo),\n      curParcelaFmt: this.brl(s.simCurParcela, true),\n      parcelaFmt: this.brl(parcela, true),\n      totalFmt: this.brl(total, true),\n      economiaFmt: this.brl(economia, true),\n\n      inssBg: inss.bg, inssColor: inss.color,\n      federalBg: fed.bg, federalColor: fed.color,\n      modeNovoBg: mNovo.bg, modeNovoColor: mNovo.color,\n      modeReduzirBg: mRed.bg, modeReduzirColor: mRed.color,\n\n      setBenefitINSS: () => this.setState({ simBenefit: 'INSS' }),\n      setBenefitFederal: () => this.setState({ simBenefit: 'Federal' }),\n      setModeNovo: () => this.setState({ simMode: 'novo' }),\n      setModeReduzir: () => this.setState({ simMode: 'reduzir' }),\n      onValor: (e) => this.setState({ simValor: +e.target.value }),\n      onPrazo: (e) => this.setState({ simPrazo: +e.target.value }),\n      onSaldo: (e) => this.setState({ simSaldo: +e.target.value }),\n      onCurParcela: (e) => this.setState({ simCurParcela: +e.target.value }),\n\n      faqItems,\n\n      fName: s.fName, fPhone: s.fPhone, fTipo: s.fTipo, fMsg: s.fMsg,\n      onFName: (e) => this.setState({ fName: e.target.value }),\n      onFPhone: (e) => this.setState({ fPhone: e.target.value }),\n      onFTipo: (e) => this.setState({ fTipo: e.target.value }),\n      onFMsg: (e) => this.setState({ fMsg: e.target.value })\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
