<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Atendimento humano, pessoa conversando com consultor">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241B12"/>
      <stop offset="1" stop-color="#15100A"/>
    </linearGradient>
    <linearGradient id="pa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D8A0"/>
      <stop offset="1" stop-color="#B58F42"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFBD7C"/>
      <stop offset="1" stop-color="#8E6F2E"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.3" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#F3DCA8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F3DCA8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="500" fill="url(#fundo)"/>
  <rect width="1100" height="500" fill="url(#luz)"/>

  <!-- mesa -->
  <path d="M0 430 L1100 430 L1100 500 L0 500 Z" fill="#100B07"/>
  <path d="M120 430 Q 550 402 980 430 L980 440 Q 550 414 120 440 Z" fill="#2A2016" opacity="0.8"/>

  <!-- ===== consultora (esquerda, de costas/3-4) ===== -->
  <g>
    <path d="M150 430 L150 300 Q150 236 236 220 L286 212 Q332 208 356 232 L392 268 Q410 288 410 322 L410 430 Z" fill="url(#pb)"/>
    <path d="M252 224 L252 184 L316 184 L316 228 Z" fill="url(#pb)"/>
    <g transform="rotate(7 284 142)">
      <ellipse cx="284" cy="142" rx="60" ry="68" fill="url(#pa)"/>
      <!-- cabelo curto com volume, envolvendo a cabeça (sem "gorro") -->
      <path d="M222 148
               Q 218 76 284 70
               Q 350 76 346 148
               Q 344 112 318 98
               Q 284 84 250 98
               Q 224 112 222 148 Z" fill="url(#pb)"/>
      <!-- coque baixo, atrás da nuca -->
      <ellipse cx="216" cy="168" rx="24" ry="27" fill="url(#pb)"/>
    </g>
  </g>

  <!-- ===== cliente (direita, de frente, sorriso implícito) ===== -->
  <g>
    <path d="M700 430 L700 322 Q700 258 780 240 L830 230 Q874 224 900 248 L938 286 Q956 306 956 342 L956 430 Z" fill="url(#pa)"/>
    <path d="M800 244 L800 202 L868 202 L868 248 Z" fill="url(#pa)"/>
    <g transform="rotate(-6 834 158)">
      <ellipse cx="834" cy="158" rx="64" ry="72" fill="url(#pb)"/>
      <!-- chapéu discreto (idoso) -->
      <path d="M770 116 Q 834 66 898 116 L898 125 Q834 90 770 125 Z" fill="url(#pa)"/>
      <path d="M742 125 Q 834 94 926 125 Q 834 152 742 125 Z" fill="url(#pa)"/>
    </g>
  </g>

  <!-- documento sobre a mesa, entre os dois: o "cuidamos da papelada" -->
  <g transform="rotate(-4 550 400)">
    <rect x="470" y="356" width="160" height="72" rx="6" fill="#F5E6C8" opacity="0.92"/>
    <rect x="488" y="376" width="112" height="7" rx="3.5" fill="#8A6E30" opacity="0.55"/>
    <rect x="488" y="392" width="88" height="7" rx="3.5" fill="#8A6E30" opacity="0.4"/>
    <rect x="488" y="408" width="66" height="7" rx="3.5" fill="#8A6E30" opacity="0.3"/>
  </g>
</svg>
