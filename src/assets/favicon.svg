      <stop offset="0" stop-color="#F0D090"/>
      <stop offset="0.55" stop-color="#D9B36B"/>
      <stop offset="1" stop-color="#A08040"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0E0A08"/>
  <!-- G -->
  <path d="M26.5 25.5 A10 10 0 1 0 26.5 38.5 L26.5 34 L21.5 34 L21.5 30 L30.5 30 L30.5 41
