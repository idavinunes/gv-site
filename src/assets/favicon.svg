<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GV Consultoria">
  <!-- Monograma GV em path, não em texto: favicon não herda as fontes da página.
       Par G+V centrado no quadro. Cores tiradas dos pixels do logo real da GV
       (dourado #A08040 → #F0D090 sobre o preto quente do site). -->
